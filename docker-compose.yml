services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: project_name-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
