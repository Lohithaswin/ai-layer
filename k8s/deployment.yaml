# ============================================================
# PROJECT_NAME Bot — Kubernetes Deployment
# ============================================================
# kubectl apply -f k8s/
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project_name-bot-api
  namespace: project_name
  labels:
    app: project_name-bot-api
    version: "1.0"
    team: your-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project_name-bot-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime deployments
  template:
    metadata:
      labels:
        app: project_name-bot-api
    spec:
      # Run as non-root (matches Dockerfile USER project_name uid=1001)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: api
        image: project_name.azurecr.io/project_name-bot-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000

        # ── Resource limits (adjust based on load testing) ───
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

        # ── Secrets from Azure Key Vault (via CSI driver) ────
        envFrom:
        - secretRef:
            name: project_name-secrets          # kubectl create secret generic project_name-secrets ...
        - configMapRef:
            name: project_name-config

        # ── Extra env vars ───────────────────────────────────
        env:
        - name: UVICORN_WORKERS
          value: "2"

        # ── Shared data volume (BM25 index + ChromaDB) ──────
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
          readOnly: true
        - name: docs-volume
          mountPath: /app/documents
          readOnly: true

        # ── Health probes ────────────────────────────────────
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 12     # 12 * 10s = 2 min for model loading
          periodSeconds: 10

      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: project_name-data-pvc
      - name: docs-volume
        persistentVolumeClaim:
          claimName: project_name-docs-pvc

      imagePullSecrets:
      - name: acr-secret
